# ============================================================================
# Qwen-Image-2512 · LoRA · SCANNER · TextDART reward
#
# TODO: deploy a TextDART server (see TextDART/train/deploy_server.sh),
# then replace the <TODO: TEXTDART_SERVER_HOST> hosts below.
# ============================================================================

launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2_4nodes.yaml
num_processes: 32
main_process_port: 29500
mixed_precision: "bf16"

data:
  dataset_dir: "dataset/multi_region_text"
  cache_dir: "dataset_cache"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: false
  preprocess_parallelism: "global"
  eval_subsample_size: 720
  eval_subsample_seed: 42
  sampler_type: "auto"

model:
  finetune_type: "lora"
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "Qwen/Qwen-Image-2512"
  model_type: "qwen-image-2512"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "TextDART_SCANNER"
  logging_backend: "wandb"
  resume_run: false
  wandb_run_id: null
  save_dir: "saves/multi_region_text/qwen_image_2512_textdart_scanner"
  save_freq: 20
  save_model_only: false
  save_samples: true
  save_samples_dir: "images"

train:
  trainer_type: "scanner"
  advantage_aggregation: "gdpo"

  clip_range: 1.0e-4
  adv_clip_range: 5.0

  kl_type: "v-based"
  kl_beta: 1.0e-3
  ref_param_device: "cuda"

  # Official Qwen-Image negative prompt (model input, intentionally Chinese).
  negative_prompt: "低分辨率，低画质，肢体畸形，手指畸形，画面过饱和，蜡像感，人脸无细节，过度光滑，画面具有AI感。构图混乱。文字模糊，扭曲。"
  resolution: 1024
  num_inference_steps: 20
  guidance_scale: 4

  per_device_batch_size: 4
  group_size: 16
  global_std: false
  unique_sample_num_per_epoch: 32
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto

  learning_rate: 1.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: true
  seed: 42

  extra_kwargs:
    fixed_noise_seed: true          # share z_T within a prompt group (varied per epoch)
    target_sigma_min: 0.0001        # min per-target std for the target z-score
    spatial_adv_clip: 5.0           # clip range of the per-target advantage
    spatial_box_weight: 0.5         # weight of text boxes in the spatial map
    kl_beta_box_scale: 1.0          # KL weight multiplier inside text boxes
    kl_beta_bg_scale: 2.0           # KL weight multiplier on the background
    missing_target_min_present: 1   # min rollouts in a group that rendered a target
    missing_target_reward: 0.0      # reward assigned to a missing target
    scanner_log_max_samples: 4          # samples visualized per temporal-advantage log

scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 1.2
  num_sde_steps: 5
  sde_steps: [2, 3, 4, 5, 6]
  sde_window_mode: "contiguous"
  sde_window_seed: 0
  seed: 42

eval:
  resolution: 1024
  per_device_batch_size: 4
  guidance_scale: 4
  negative_prompt: "低分辨率，低画质，肢体畸形，手指畸形，画面过饱和，蜡像感，人脸无细节，过度光滑，画面具有AI感。构图混乱。文字模糊，扭曲。"
  num_inference_steps: 50
  eval_freq: 20
  seed: 42

rewards:
  - name: "textdart"
    reward_model: "textdart"
    weight: 1.0
    batch_size: 16
    device: "cpu"
    dtype: float32
    timeout: 180.0
    retry_attempts: 10
    server_urls:  # one or more TextDART endpoints; ranks are spread across them
      - "http://<TODO: TEXTDART_SERVER_HOST>:1925"
    max_tokens: 2048
    repetition_penalty: 1.0
    image_max_token_num: 2304
    emit_quad_2d: true
    qua_amplify_factor: 1.0
    count_markers_by_weight: true
    target_w_sem: 0.5
    target_w_qua: 0.5
    target_extra_penalty_factor: 0.0
    pure_marker_mode: extra
    require_target_list: true
    text_joiner: " "
    component_weights:
      semantic: 0.5
      quality: 0.5
    normalize_component_weights: true
    async_reward: true
    num_workers: 4

eval_rewards:
  - name: "textdart"
    reward_model: "textdart"
    weight: 1.0
    batch_size: 16
    device: "cpu"
    dtype: float32
    timeout: 180.0
    retry_attempts: 10
    server_urls:
      - "http://<TODO: TEXTDART_SERVER_HOST>:1925"
    max_tokens: 2048
    repetition_penalty: 1.0
    image_max_token_num: 2304
    emit_quad_2d: true
    qua_amplify_factor: 1.0
    count_markers_by_weight: true
    target_w_sem: 0.5
    target_w_qua: 0.5
    target_extra_penalty_factor: 0.0
    pure_marker_mode: extra
    require_target_list: true
    async_reward: true
    num_workers: 4
